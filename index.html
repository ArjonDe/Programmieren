        return;
    }
    int oldCount = errorCount;
    pauseTiny();
    synchronized (this) {
        errorCount = oldCount + 1;

}`,optionen:["Der alte Wert wird vor dem synchronized-Block gelesen – Lesen, Verändern und Schreiben müssen gemeinsam geschützt werden.","synchronized(this) ist in Java nicht erlaubt.","pauseTiny() muss entfernt werden, dann ist alles korrekt.","Nicht-ERROR-Einträge werden mitgezählt."],korrekt:0,erklaerung:"Der kritische Bereich muss das Lesen einschließen; sonst rechnen beide Threads mit demselben alten Wert.",fundstelle:"FP W10 Pflichttest (ErrorCounter)"},{id:"qf-thr-5",topic:"fp-threads",typ:"order",schwierigkeit:2,frage:"Bringe den Ablauf zur parallelen Auswertung in die richtige Reihenfolge.",schritte:["Runnables für die Loglisten definieren","Thread-Objekte mit den Runnables erzeugen","Threads mit start() starten","Mit join() auf die Worker warten","Ergebnis ausgeben"],erklaerung:"Thread-Objekte erzeugen, mit start() starten und vor dem Ergebnislesen mit join() abwarten.",fundstelle:"FP W10 Pflichttest"},{id:"qf-thr-6",topic:"fp-threads",typ:"truefalse",schwierigkeit:1,frage:"auth.start() steht vor billing.start() im Quelltext – daher gibt auth garantiert zuerst aus.",korrekt:!1,erklaerung:"Ohne weitere Synchronisation ist die Reihenfolge nicht festgelegt.",fundstelle:"FP W10 Selbstlern-Check, Frage 4"},{id:"qf-pkg-1",topic:"fp-packaging",typ:"multi",schwierigkeit:2,klausur:!0,punkte:4,frage:"Welche Aussagen zu JAR-Dateien, Manifest und Classpath sind korrekt?",optionen:["javac erzeugt aus .java-Quelltext .class-Bytecode.","Der Manifest-Eintrag Main-Class wählt den Einstiegspunkt für java -jar.","Eine externe Bibliothek muss ggf. beim Kompilieren und beim Starten über den Classpath auffindbar sein.","Eine JAR ist nur ausführbar, wenn zuvor HTML-Javadoc erzeugt wurde.","jar cf nimmt automatisch alle externen Bibliotheken des Rechners auf."],korrekt:[0,1,2],erklaerung:"Eine normale JAR bündelt Abhängigkeiten nicht automatisch; Javadoc ist keine Voraussetzung.",fundstelle:"FP Klausurvorbereitung (Testversuch), Frage 3"},{id:"qf-pkg-2",topic:"fp-packaging",typ:"single",schwierigkeit:2,frage:"Was bewirkt jar cf jar-demo.jar -C out . ?",optionen:["Erstellt jar-demo.jar aus dem Inhalt von out/, sodass die Paketstruktur z. B. mit de/... beginnt.","Kompiliert src/ und lädt Bibliotheken herunter.","Kopiert out/ als obersten Ordner und erzeugt automatisch ein Manifest mit Main-Class.","Startet JarDemoMain aus out/."],korrekt:0,erklaerung:"-C out . wechselt für das Packen in den Ordner out.",fundstelle:"FP W11 Selbstlern-Check, Frage 2"},{id:"qf-pkg-3",topic:"fp-packaging",typ:"single",schwierigkeit:2,klausur:!0,frage:"Erfolgreich kompiliert, beim Start: NoClassDefFoundError: org/apache/logging/log4j/LogManager. Ursache?",optionen:["Die Log4j-JARs fehlen im Runtime-Classpath oder werden nicht mit ausgeliefert.","Javadoc enthält keinen @throws-Tag.","Der Compiler konnte nicht importieren, deshalb gibt es keine .class-Datei.","Das Manifest enthält keinen Main-Class-Eintrag."],korrekt:0,erklaerung:"Erfolgreiches Kompilieren zeigt nur, dass der Compile-Classpath stimmte.",fundstelle:"FP W11 Pflichttest"},{id:"qf-pkg-4",topic:"fp-packaging",typ:"single",schwierigkeit:1,frage:"Root-Level in log4j2.xml ist info. Welche Meldungen erscheinen?",optionen:["info, warn und error; debug wird unterdrückt.","Alle vier.","Nur error.","Keine, solange kein Javadoc erzeugt wurde."],korrekt:0,erklaerung:"DEBUG liegt unter INFO und erscheint erst ab Level debug.",fundstelle:"FP W11 Selbstlern-Check, Frage 5"},{id:"qf-pkg-5",topic:"fp-packaging",typ:"match",schwierigkeit:2,frage:"Ordne zu.",paare:[["javac",".java → .class"],["jar cfe","JAR mit Main-Class erzeugen"],["Fat-JAR","bündelt Abhängigkeiten in einem Artefakt"],["Appender","bestimmt das Ziel der Log-Ausgabe"]],erklaerung:"Appender = Ziel, Layout = Format, Level = Schwelle.",fundstelle:"FP W11 Selbstlern-Check & Pflichttest"},{id:"qf-tst-1",topic:"fp-testing",typ:"single",schwierigkeit:1,klausur:!0,punkte:4,frage:"Was prüft assertThrows(IllegalArgumentException.class, () -> parser.parse(null)); ?",optionen:["Der Aufruf parser.parse(null) soll eine IllegalArgumentException werfen.","Der Aufruf soll null zurückgeben.","Der Compiler soll einen Syntaxfehler melden.","Jede beliebige Exception wird ignoriert."],korrekt:0,erklaerung:"Bleibt die Exception aus oder ist der Typ unpassend, schlägt der Test fehl.",fundstelle:"FP Probeklausur, Frage 10"},{id:"qf-tst-2",topic:"fp-testing",typ:"multi",schwierigkeit:2,klausur:!0,punkte:2,frage:"Welche Aussagen zu Annotations und Reflection sind korrekt?",optionen:["Eine Annotation ist passive Metadaten und bewirkt ohne Compiler, Framework oder Werkzeug zunächst nichts.","RetentionPolicy.RUNTIME macht eine Annotation für Reflection zur Laufzeit verfügbar.","@Override kann vom Compiler gelesen werden, um eine überschreibende Methode zu prüfen.","@Target legt fest, wie lange eine Annotation gespeichert bleibt.","Method.invoke(...) liest nur den Methodennamen, ohne auszuführen."],korrekt:[0,1,2],erklaerung:"@Target legt zulässige Programmelemente fest; invoke führt die Methode aus.",fundstelle:"FP Klausurvorbereitung (Testversuch), Frage 1",tipp:"Im Testversuch nur 0,67/2 – @Target ≠ Lebensdauer!"},{id:"qf-tst-3",topic:"fp-testing",typ:"single",schwierigkeit:1,frage:"Welche Aussage zu assertEquals(expected, actual) ist korrekt?",optionen:["Erster Parameter: erwarteter Wert, zweiter: tatsächlich berechneter Wert.","Erster Parameter: tatsächlicher Wert, zweiter: erwarteter Wert.","Die Reihenfolge ist fachlich egal.","Es wird geprüft, ob zwei Variablen denselben Namen haben."],korrekt:0,erklaerung:"Bei Unterschied ist der Test rot.",fundstelle:"FP W12 Pflichttest"},{id:"qf-tst-4",topic:"fp-testing",typ:"order",schwierigkeit:1,frage:"Ein Grenzfall wird noch falsch behandelt. Ordne nach Red-Green-Refactor.",schritte:["Test für den Grenzfall schreiben","Test läuft rot","Implementierung korrigieren, bis der Test grün ist","Code bei Bedarf refaktorisieren"],erklaerung:"Zuerst ein aussagekräftiger Test, der zunächst rot sein darf.",fundstelle:"FP W12 Pflichttest"},{id:"qf-tst-5",topic:"fp-testing",typ:"match",schwierigkeit:2,frage:"Wer wertet die Annotation aus?",paare:[["@Override","Compiler"],["@FunctionalInterface","Compiler"],["@Test","JUnit"],["@Deprecated","Compiler und IDE"]],erklaerung:"Annotationen wirken erst durch ihren Auswerter.",fundstelle:"FP W12 Pflichttest"},{id:"qf-tst-6",topic:"fp-testing",typ:"single",schwierigkeit:3,frage:"Warum braucht ein Mini-JUnit-Runner Reflection?",optionen:["Er muss zur Laufzeit Methoden finden, mit isAnnotationPresent(...) prüfen und per invoke(...) ausführen.","Damit Quellcode ohne Compiler ausgeführt werden kann.","Reflection verhindert Exceptions.","Nur um private Felder schneller zu sortieren."],korrekt:0,erklaerung:"Bausteine: getDeclaredMethods(), isAnnotationPresent(Test.class), invoke(...), getCause().",fundstelle:"FP W12 Selbstlern-Check, Frage 6; W12 Pflichttest"},{id:"qf-tst-7",topic:"fp-testing",typ:"single",schwierigkeit:1,frage:"Ein Test kompiliert; assertEquals(expected, actual) schlägt beim Ausführen fehl. Ergebnis?",optionen:["Der Test ist rot.","Der Test ist grün, weil er kompiliert.","Ein Compilerfehler.","Kein Testergebnis – Assertions sind Kommentare."],korrekt:0,erklaerung:"Eine fehlschlagende Assertion macht den Test rot.",fundstelle:"FP W12 Selbstlern-Check, Frage 4"}],B=String.raw,bp=[{id:"tg-1",topic:"gdp-eingaben",kategorie:"einsteiger",schwierigkeit:1,punkte:5,titel:"VariablenTest: Name, Alter, Größe",aufgabe:"Schreibe VariablenTest.java: Lies mit dem Scanner einen Namen (String), ein Alter (int) und eine Körpergröße in Metern (double) ein. Gib „Hallo, [Name]!“, „Du bist [Alter] Jahre alt.“ und die Größe aus. Berechne das Alter in Monaten (alter * 12). Lege die Konstante final double MWST = 0.19 an und gib sie aus. Gib die Größe zusätzlich als int aus (Casting).",loesung:B`import java.util.Scanner;

public class VariablenTest {
    public static void main(String[] args) {
        Scanner myScanner = new Scanner(System.in);

        System.out.print("Bitte geben Sie Ihren Namen ein: ");
        String name = myScanner.nextLine();
        System.out.println("Hallo, " + name + "!");

        System.out.print("Bitte geben Sie Ihr Alter ein: ");
        int alter = myScanner.nextInt();
        System.out.println("Du bist " + alter + " Jahre alt.");

        System.out.print("Bitte geben Sie Ihre Größe (m) ein: ");
        double groesse = myScanner.nextDouble();
        System.out.println("Größe: " + groesse);

        System.out.println("Alter in Monaten: " + (alter * 12));

        final double MWST = 0.19;
        System.out.println("Mehrwertsteuersatz: " + MWST);

        // Explizites Casting: Nachkommastellen gehen verloren
        System.out.println("Größe als int: " + (int) groesse);

        myScanner.close();
    }
}`,erklaerung:"Scanner-Methoden nextLine/nextInt/nextDouble (Cheatsheet), Konstante mit final, explizites Casting schneidet Nachkommastellen ab.",fundstelle:"Aufgabenblatt 2, Warm-Up 1–13",checkliste:["Scanner importiert und erzeugt","Alle drei Werte mit passendem Typ eingelesen","Ausgabe in Monaten korrekt","final-Konstante verwendet","(int)-Cast für die Größe","Scanner geschlossen"]},{id:"tg-2",topic:"gdp-casting",kategorie:"einsteiger",schwierigkeit:1,punkte:5,titel:"ParsenUndCasten",aufgabe:'Lies eine Zahl als Text ein (z. B. "42") und wandle sie in int um. Lies eine Kommazahl als Text ("3.14") und wandle sie in double um. Deklariere double preis = 12.99, caste nach int und gib beide Werte aus. Erkläre in einem Kommentar, was beim Casten passiert.',loesung:B`import java.util.Scanner;

public class ParsenUndCasten {
    public static void main(String[] args) {
        Scanner myScanner = new Scanner(System.in);

        System.out.print("Ganze Zahl: ");
        String text = myScanner.nextLine();
        int zahl = Integer.parseInt(text);
        System.out.println("int: " + zahl);

        System.out.print("Kommazahl (mit Punkt): ");
        String text2 = myScanner.nextLine();
        double komma = Double.parseDouble(text2);
        System.out.println("double: " + komma);

        double preis = 12.99;
        // Explizites Casting ist nicht verlustfrei:
        // die Nachkommastellen werden abgeschnitten (12.99 -> 12).
        int ganz = (int) preis;
        System.out.println(preis + " -> " + ganz);

        myScanner.close();
    }
}`,erklaerung:"Parsing rechnet Text um, Casting ändert die Interpretation. Achtung: Double.parseDouble erwartet einen Punkt.",fundstelle:"Aufgabenblatt 3, Warm-Up 1–3; GdP U8, Folien 97, 104",checkliste:["Integer.parseInt verwendet","Double.parseDouble verwendet","(int) preis","Kommentar zum Datenverlust"]},{id:"tg-3",topic:"gdp-logik",kategorie:"einsteiger",schwierigkeit:1,punkte:4,titel:"Wahrheitstabellen ausfüllen",aufgabe:"Fülle die Wahrheitstabellen für A && B, A || B, !A und A ^ B (Aufgabenblatt 5) aus. Schreibe dazu ein Programm, das für alle vier Kombinationen von A und B die Ergebnisse ausgibt.",loesung:B`public class Wahrheitstabellen {
    public static void main(String[] args) {
        boolean[] werte = {false, true};
        System.out.println("A\tB\tA&&B\tA||B\t!A\tA^B");
        for (boolean a : werte) {
            for (boolean b : werte) {
                System.out.println(a + "\t" + b + "\t" + (a && b) + "\t"
                        + (a || b) + "\t" + (!a) + "\t" + (a ^ b));
            }
        }
    }
}
// Ergebnis:
// false false -> && false, || false, !A true,  ^ false
// false true  -> && false, || true,  !A true,  ^ true
// true  false -> && false, || true,  !A false, ^ true
// true  true  -> && true,  || true,  !A false, ^ false`,erklaerung:"Bei 2 Variablen gibt es 2² = 4 Zeilen. XOR ist true, wenn die Werte verschieden sind.",fundstelle:"Aufgabenblatt 5, Warm-Up; GdP U10, Folien 166–171",checkliste:["Alle 4 Kombinationen","AND korrekt","OR korrekt","XOR korrekt"]},{id:"tg-4",topic:"gdp-while",kategorie:"einsteiger",schwierigkeit:1,punkte:5,titel:"Schleifen-Warm-Up: Würfeln, Halbieren, Passwort",aufgabe:'a) Würfle mit (int)(6 * Math.random()) + 1 mindestens einmal und höre erst auf, wenn eine 6 fällt. b) Teile eine Zahl immer wieder durch 2, bis das Ergebnis kleiner als 1 ist, und gib jedes Zwischenergebnis aus. c) Frage so lange nach einem Passwort, bis "Zauberwort" eingegeben wurde; danach „Zugang gewährt“.',loesung:B`import java.util.Scanner;

public class SchleifenWarmUp {
    public static void main(String[] args) {
        // a) do-while: mindestens einmal würfeln
        int wurf;
        do {
            wurf = (int) (6 * Math.random()) + 1;
            System.out.println("Gewürfelt: " + wurf);
        } while (wurf != 6);

        // b) while: halbieren
        double zahl = 37;
        while (zahl >= 1) {
            zahl = zahl / 2;
            System.out.println(zahl);
        }

        // c) Passwortabfrage mit equals
        Scanner myScanner = new Scanner(System.in);
        String eingabe;
        do {
            System.out.print("Passwort: ");
            eingabe = myScanner.nextLine();
        } while (!eingabe.equals("Zauberwort"));
        System.out.println("Zugang gewährt");
        myScanner.close();
    }
}`,erklaerung:"do-while für „mindestens einmal“, Strings mit equals vergleichen, Variablen der Bedingung vor der Schleife deklarieren.",fundstelle:"Aufgabenblatt 6, Warm-Up 2–4",checkliste:["do-while für das Würfeln","Abbruchbedingung zahl < 1 korrekt","equals statt ==","Variable vor der Schleife deklariert"]},{id:"tg-5",topic:"gdp-klassen",kategorie:"mittel",schwierigkeit:2,punkte:8,titel:"Klasse Student mit Konstruktor",aufgabe:"Erstelle eine Klasse Student mit den Attributen name, matrikelnummer, alter, studiengang. Füge einen Konstruktor hinzu, der name, alter und studiengang entgegennimmt und die matrikelnummer zufällig erzeugt (z. B. Jahr + 6 Ziffern). Erzeuge in main „Charlie Pixel, 24, Wirtschaftsinformatik“ und gib alle Attribute aus.",loesung:B`public class Student {
    String name;
    int matrikelnummer;
    int alter;
    String studiengang;

    public Student(String name, int alter, String studiengang) {
        this.name = name;
        this.alter = alter;
        this.studiengang = studiengang;
        // Jahr (2025) + 6 zufällige Ziffern -> passt nicht in int, daher nur 6 Ziffern + Präfix 25
        this.matrikelnummer = 25_000_000 + (int) (Math.random() * 1_000_000);
    }

    public static void main(String[] args) {
        Student s = new Student("Charlie Pixel", 24, "Wirtschaftsinformatik");
        System.out.println(s.name);
        System.out.println(s.matrikelnummer);
        System.out.println(s.alter);
        System.out.println(s.studiengang);
    }
}`,erklaerung:"Konstruktor setzt Startwerte; this.name unterscheidet Attribut und Parameter. Hinweis: „Jahr + 6 Ziffern“ (z. B. 2025123456) überschreitet den int-Bereich (max. 2 147 483 647) – daher hier ein verkürztes Jahr bzw. alternativ long.",fundstelle:"Aufgabenblatt 4, Warm-Up und Erweiterung; Cheatsheet (int-Wertebereich)",checkliste:["Klasse mit 4 Attributen","Konstruktor mit Parametern","Zufällige Matrikelnummer mit Math.random()","Objekt mit new erzeugt","Alle Attribute ausgegeben"]},{id:"tg-6",topic:"gdp-if",kategorie:"mittel",schwierigkeit:2,punkte:10,titel:"Schnick, Schnack, Schnuck am magischen Tor",aufgabe:"Klasse Spieler (name, gewonneneRunden, Konstruktor setzt Namen). In main: Benutzer und Torwächter anlegen. Pro Runde wählt der Benutzer per Scanner (1 = Schere, 2 = Stein, 3 = Papier), der Torwächter würfelt mit Math.random(). Schere schlägt Papier, Stein schlägt Schere, Papier schlägt Stein, Gleiches = unentschieden. Wer zuerst 2 Runden gewinnt, gewinnt. Ausgabe: „Das Tor öffnet sich – du hast gewonnen!“ bzw. „Der Torwächter lacht – du hast verloren!“",loesung:B`import java.util.Scanner;

class Spieler {
    String name;
    int gewonneneRunden;

    public Spieler(String name) {
        this.name = name;
        this.gewonneneRunden = 0;
    }
}

public class MagischesTor {
    public static void main(String[] args) {
        Scanner myScanner = new Scanner(System.in);
        System.out.print("Dein Name: ");
        Spieler spieler = new Spieler(myScanner.nextLine());
        Spieler waechter = new Spieler("Torwächter");

        while (spieler.gewonneneRunden < 2 && waechter.gewonneneRunden < 2) {

class KampfUtils {
    static int wuerfleZwischen(int min, int max) {
        return min + (int) (Math.random() * (max - min + 1));
    }

    static int berechneSchaden() {
        return wuerfleZwischen(5, 15) * 2;
    }

    static void fuehreAngriffAus(Spieler angreifer, Spieler verteidiger) {
        int schaden = berechneSchaden();
        verteidiger.lebenspunkte -= schaden;
        if (verteidiger.lebenspunkte < 0) {
            verteidiger.lebenspunkte = 0;
        }
        System.out.println(angreifer.name + " greift " + verteidiger.name
                + " an und verursacht " + schaden + " Schaden.");
    }

    static void heile(Spieler s, int diamantenAnzahl) {
        if (s.diamanten < 1 || diamantenAnzahl < 1 || diamantenAnzahl > s.diamanten) {
            System.out.println("Nicht genug Diamanten – keine Heilung.");
            return;
        }
        int heilung = Math.min(diamantenAnzahl * 3, 15);
        int vorher = s.lebenspunkte;
        s.lebenspunkte = Math.min(100, s.lebenspunkte + heilung);
        s.diamanten -= diamantenAnzahl;
        System.out.println(s.name + " wurde um " + (s.lebenspunkte - vorher)
                + " geheilt: LP " + s.lebenspunkte + ", Diamanten " + s.diamanten);
    }
}`,erklaerung:"Bereich [min, max] inklusiv: min + (int)(Math.random() * (max − min + 1)). Objekte werden als Referenz übergeben – Änderungen an verteidiger.lebenspunkte bleiben erhalten.",fundstelle:"Aufgabenblatt 9; GdP Methoden, Folie 259 (Referenzdatentypen)",checkliste:["Nur statische Methoden in KampfUtils","Inklusiver Zufallsbereich","Schaden = Würfel(5,15) · 2","LP nie unter 0","Heilung max. 15 und LP max. 100","Diamanten abgezogen"]},{id:"tg-10",topic:"gdp-arrays",kategorie:"mittel",schwierigkeit:2,punkte:10,titel:"Schlachtfeld 5×5 (2D-Array)",aufgabe:"Klasse Spieler (name, einheiten), Klasse Spiel (char[][] feld = new char[5][5], ritter, orks). Fülle das Feld mit verschachtelten for-Schleifen zufällig mit 'R', 'O' oder '.', gib es aus, zähle Ritter und Orks und gib den Sieger (oder Unentschieden) aus.",loesung:B`class Spieler {

public static int parseStatusCodeOrThrow(String line) throws CorruptedLineException {
    if (line == null || line.trim().isEmpty()) {
        throw new CorruptedLineException("Line darf nicht null oder leer sein");
    }
    String trimmed = line.trim();
    final String prefix = "STATUS:";
    if (!trimmed.startsWith(prefix)) {
        throw new CorruptedLineException("Line muss mit STATUS: beginnen");
    }
    int code;
    try {
        code = Integer.parseInt(trimmed.substring(prefix.length()));
    } catch (NumberFormatException e) {
        throw new CorruptedLineException("Code muss eine ganze Zahl sein");
    }
    if (code < 100 || code > 599) {
        throw new CorruptedLineException("Code muss im Bereich 100-599 liegen");

    public static boolean hasSlowClientError(List<LogEntry> logs, int minDurationMs) {
        return logs.stream()
                .anyMatch(e -> e.isClientError() && e.getDurationMs() >= minDurationMs);
    }

    public static Optional<LogEntry> firstErrorForService(List<LogEntry> logs, String service) {
        return logs.stream()
                .filter(LogEntry::isError)
                .filter(e -> e.getService().equals(service))

    public static int totalDurationOfService(List<LogEntry> logs, String service) {

    // 1 timestamp; 2 level; 3 service; 4 code; 5 durationMs; 6 message
    private static final java.util.regex.Pattern PATTERN =
        java.util.regex.Pattern.compile("([^;]*);([^;]*);([^;]*);([^;]*);([^;]*);(.*)");

    public String maskCode(String rawLine) {
        java.util.regex.Matcher m = PATTERN.matcher(rawLine);
        if (!m.matches()) {
            return rawLine;
        }
        return m.group(1) + ";" + m.group(2) + ";" + m.group(3) + ";<code>;"
                + m.group(5) + ";" + m.group(6);
    }

    public String extractServiceCodeAndMessage(String rawLine) {
        java.util.regex.Matcher m = PATTERN.matcher(rawLine);
        if (!m.matches()) {
            return "nicht gefunden";
        }
        return m.group(3) + " -> " + m.group(4) + ": " + m.group(6);
    }
}`,erklaerung:"Eine Gruppe pro Feld; [^;]* = beliebig viele Zeichen außer Semikolon. Nach matches() sind die Gruppen lesbar.",fundstelle:"FP W07 Pflichttest",checkliste:["Sechs Gruppen","matches() geprüft","Nur Gruppe 4 maskiert","Format exakt"]},{id:"tf-17",topic:"fp-collections1",kategorie:"fortgeschritten",schwierigkeit:3,punkte:10,titel:"LogReviewBoard mit List",aufgabe:"Intern List<String> = new ArrayList<>(). Konstruktor mit Collection kopiert (null → leer). append, insertAfterFirst(existing, new), moveFirstMatchToFront, removeFirst (als Objekt), entriesStartingWith(prefix) (prefix null → Exception), snapshot() (neue Liste), size(). null/leere Einträge → IllegalArgumentException.",loesung:K`public class LogReviewBoard {
    private final List<String> entries;

    public LogReviewBoard() {
        this.entries = new ArrayList<>();
    }

    public LogReviewBoard(Collection<String> initialEntries) {
        this();
        if (initialEntries != null) {
            for (String entry : initialEntries) {
                append(entry);
            }
        }
    }

    public void append(String entry) {
        validate(entry);
        entries.add(entry);
    }

    public boolean insertAfterFirst(String existingEntry, String newEntry) {
        validate(existingEntry);
        validate(newEntry);
        int index = entries.indexOf(existingEntry);
        if (index < 0) {
            return false;
        }
        entries.add(index + 1, newEntry);
        return true;
    }

    public boolean moveFirstMatchToFront(String entry) {
        validate(entry);
        if (!entries.remove(entry)) {
            return false;
        }
        entries.add(0, entry);
        return true;
    }

    public boolean removeFirst(String entry) {
        validate(entry);
        return entries.remove(entry);   // remove(Object)
    }

    public List<String> entriesStartingWith(String prefix) {
        if (prefix == null) {
            throw new IllegalArgumentException("prefix must not be null");
        }
        List<String> result = new ArrayList<>();
        for (String entry : entries) {
            if (entry.startsWith(prefix)) {
                result.add(entry);
            }
        }
        return result;
    }

    public List<String> snapshot() {
        return new ArrayList<>(entries);
    }

    public int size() {
        return entries.size();
    }

    private void validate(String entry) {
        if (entry == null || entry.trim().isEmpty()) {
            throw new IllegalArgumentException("entry must not be blank");
        }
    }
}`,erklaerung:"remove(Object) entfernt das erste passende Element und liefert, ob etwas entfernt wurde. add(index, element) fügt ohne manuelles Verschieben ein.",fundstelle:"FP W04 Pflichttest",checkliste:["ArrayList im Konstruktor","Kopierkonstruktor null-sicher","indexOf + add(index+1)","remove(Object) + add(0, …)","Neue Liste in snapshot","Validierung"]},{id:"tf-18",topic:"fp-generics",kategorie:"fortgeschritten",schwierigkeit:2,punkte:8,titel:"EventSlot<T>",aufgabe:'Hauptereignis (Konstruktor, getPrimary/setPrimary) und optionales Ersatzereignis (getBackup/setBackup, null = keins). hasBackup(), effective() (Backup falls gesetzt, sonst primary), describe() (ohne Backup nur primary, sonst "primary -> backup").',loesung:K`class EventSlot<T> {
    private T primary;

    public T getPrimary() { return primary; }
    public void setPrimary(T primary) { this.primary = primary; }
    public T getBackup() { return backup; }
    public void setBackup(T backup) { this.backup = backup; }
